name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: silence-linux-x86_64
          - os: macos-15-intel
            asset: silence-darwin-x86_64
          - os: macos-14
            asset: silence-darwin-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cp target/release/silence "${{ matrix.asset }}"
      - run: ./"${{ matrix.asset }}" --help
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
