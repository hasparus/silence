name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: silence-linux-x86_64
            grammar_platform: linux-x86_64
            grammar_ext: so
            shell: bash
          - os: ubuntu-24.04-arm
            asset: silence-linux-aarch64
            grammar_platform: linux-aarch64
            grammar_ext: so
            shell: bash
          - os: macos-15-intel
            asset: silence-darwin-x86_64
            grammar_platform: darwin-x86_64
            grammar_ext: dylib
            shell: bash
          - os: macos-14
            asset: silence-darwin-aarch64
            grammar_platform: darwin-aarch64
            grammar_ext: dylib
            shell: bash
          - os: windows-2025-vs2026
            asset: silence-windows-x86_64.exe
            grammar_platform: windows-x86_64
            grammar_ext: dll
            shell: bash
            linker_env: CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link.exe
          - os: windows-11-arm
            asset: silence-windows-aarch64.exe
            grammar_platform: windows-aarch64
            grammar_ext: dll
            shell: bash
            linker_env: ""
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Build
        run: |
          if [ -n "${{ matrix.linker_env || '' }}" ]; then
            export "${{ matrix.linker_env }}"
          fi
          cargo build --release -p silence-cli -p silence-grammar-packs
      - name: Stage CLI asset
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/silence.exe "${{ matrix.asset }}"
          else
            cp target/release/silence "${{ matrix.asset }}"
          fi
      - name: Stage grammar dylibs
        run: |
          ext="${{ matrix.grammar_ext }}"
          platform="${{ matrix.grammar_platform }}"
          expected=$(grep -c 'OptionalPack {' crates/silence-langs/src/optional_packs.rs)
          shopt -s nullglob
          libs=(target/release/libsilence_grammar_*.${ext})
          if [ "${#libs[@]}" -ne "$expected" ]; then
            echo "built ${#libs[@]} grammar dylibs, expected $expected"
            exit 1
          fi
          for lib in "${libs[@]}"; do
            pack="${lib##*/libsilence_grammar_}"
            pack="${pack%.${ext}}"
            cp "$lib" "silence-grammar-${pack}-${platform}.${ext}"
          done
          staged=(silence-grammar-*-${platform}.${ext})
          if [ "${#staged[@]}" -ne "$expected" ]; then
            echo "staged ${#staged[@]} grammar dylibs, expected $expected"
            exit 1
          fi
      - name: Smoke test
        run: ./"${{ matrix.asset }}" --help
      - name: Install rsign2
        run: |
          if [ -n "${{ matrix.linker_env || '' }}" ]; then
            export "${{ matrix.linker_env }}"
          fi
          cargo install --locked rsign2
      - name: Sign grammar dylibs
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          secret_key="${MINISIGN_SECRET_KEY:-${MINISIGN_PRIVATE_KEY:-}}"
          test -n "$secret_key" || { echo "MINISIGN_SECRET_KEY missing"; exit 1; }
          key_file="$(mktemp)"
          printf '%b\n' "$secret_key" > "$key_file"
          ext="${{ matrix.grammar_ext }}"
          platform="${{ matrix.grammar_platform }}"
          for asset in silence-grammar-*-${platform}.${ext}; do
            printf '%s\n' "$MINISIGN_PASSWORD" | rsign sign -s "$key_file" -W -x "${asset}.minisig" "$asset"
          done
          rm -f "$key_file"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.asset }}
            silence-grammar-*-${{ matrix.grammar_platform }}.${{ matrix.grammar_ext }}
            silence-grammar-*-${{ matrix.grammar_platform }}.${{ matrix.grammar_ext }}.minisig

  publish-crates:
    name: crates.io
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Publish workspace crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          test -n "${CARGO_REGISTRY_TOKEN:-}" || {
            echo "CARGO_REGISTRY_TOKEN secret is required"
            exit 1
          }

          version="${GITHUB_REF_NAME#v}"
          workspace_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test "$version" = "$workspace_version" || {
            echo "tag version $version does not match workspace version $workspace_version"
            exit 1
          }

          crate_published() {
            curl -A "hasparus/silence release workflow" -fsSL "https://crates.io/api/v1/crates/$1/$2" >/dev/null 2>&1
          }

          wait_for_crate() {
            local crate="$1"
            for _ in {1..30}; do
              if crate_published "$crate" "$version"; then
                return 0
              fi
              sleep 10
            done
            echo "$crate $version did not appear in the crates.io index in time"
            return 1
          }

          publish_crate() {
            local package="$1"
            local crate="$2"
            if crate_published "$crate" "$version"; then
              echo "$crate $version is already published"
              return 0
            fi
            cargo publish -p "$package" --locked
            wait_for_crate "$crate"
          }

          publish_crate silence-strip-langs silence-strip-langs
          publish_crate silence-strip-grammars silence-strip-grammars
          publish_crate silence-strip-core silence-strip-core
          publish_crate silence-cli silence-cli
