[package]
name = "silence-strip-grammars"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Built-in and on-demand tree-sitter grammars for silence"
keywords = ["tree-sitter", "grammar"]
categories = ["parser-implementations"]
build = "build.rs"

[lib]
name = "silence_grammars"
path = "src/lib.rs"

[features]
default = ["embed-optional"]
embed-optional = [
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-go",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-java",
    "dep:tree-sitter-kotlin-ng",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-css",
    "dep:tree-sitter-yaml",
    "dep:tree-sitter-astro-next",
]

[build-dependencies]
silence-strip-langs = { workspace = true }

[dependencies]
silence-strip-langs = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-toml-ng = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-kotlin-ng = { workspace = true, optional = true }
tree-sitter-swift = { workspace = true, optional = true }
tree-sitter-c-sharp = { workspace = true, optional = true }
tree-sitter-css = { workspace = true, optional = true }
tree-sitter-yaml = { workspace = true, optional = true }
tree-sitter-astro-next = { workspace = true, optional = true }
libloading = "0.8"
thiserror = { workspace = true }
ureq = { version = "3", default-features = true, features = ["rustls"] }
minisign-verify = "0.2"

[dev-dependencies]
tempfile = "3"
minisign = "0.7"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
